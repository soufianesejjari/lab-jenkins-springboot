# =============================================================================
# Bonus (étape 11 du LAB) : le même pipeline CI en GitHub Actions.
#
# Sécurité : ici les actions sont référencées par tag (@v5) pour rester lisibles.
# En PRODUCTION, épinglez-les par SHA de commit complet, par exemple :
#   uses: actions/checkout@<sha-40-caractères> # v5
# (un tag peut être déplacé par un attaquant ; un SHA ne peut pas l'être).
# =============================================================================
name: CI tasks-api

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Droits minimaux par défaut pour tous les jobs
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, tests et couverture
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: JDK 21 (Temurin) + cache Maven
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # verify = checkstyle (validate) + tests + rapport JaCoCo + quality gate couverture
      - name: Build et tests
        run: ./mvnw -B verify

      - name: Résumé des tests
        if: always()
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          tests = failures = errors = skipped = 0
          rows = []
          for f in sorted(glob.glob("target/surefire-reports/TEST-*.xml")):
              r = ET.parse(f).getroot()
              t, fa, e, s = (int(r.get(k, 0)) for k in ("tests", "failures", "errors", "skipped"))
              tests += t; failures += fa; errors += e; skipped += s
              status = "OK" if fa + e == 0 else "ECHEC"
              rows.append(f"| {r.get('name')} | {t} | {fa + e} | {status} |")
          print("## Résultats des tests")
          print(f"**{tests}** tests, **{failures + errors}** en échec, **{skipped}** ignorés\n")
          print("| Classe | Tests | Échecs | Statut |")
          print("|---|---|---|---|")
          print("\n".join(rows) if rows else "| (aucun rapport) | 0 | 0 | - |")
          EOF

      - name: Rapport de couverture JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore

      - name: Jar
        uses: actions/upload-artifact@v4
        with:
          name: tasks-api-jar
          path: target/*.jar

  image:
    name: Image Docker -> GHCR
    needs: build
    # Uniquement sur un push vers main (pas sur les pull requests)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Seul ce job a le droit d'écrire dans le registre de paquets
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags et labels de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/tasks-api
          tags: |
            type=sha,format=short,prefix=
            type=raw,value=latest

      - name: Build et push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.sha }}
            APP_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
