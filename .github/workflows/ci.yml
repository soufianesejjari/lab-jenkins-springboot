# =============================================================================
# Pipeline CI/CD de tasks-api avec GitHub Actions — démo « preuve de concept »
#
#   build ──► image ──► deploy-dev ──► deploy-prod
#   (lint,    (GHCR,     (auto,          (attend une approbation
#    tests)    tag=SHA)   environnement   si l'environnement « prod »
#                         « dev »)        a des « Required reviewers »)
#
# Les deux déploiements utilisent LA MÊME image. Ce qui change :
#   - les variables  (Settings > Environments > dev|prod > Variables) : DB_NAME, DB_USER
#   - les secrets    (Settings > Environments > dev|prod > Secrets)   : DB_PASSWORD
#
# Sécurité : les actions sont référencées par tag (@v5) pour rester lisibles.
# En PRODUCTION, épinglez-les par SHA de commit complet :
#   uses: actions/checkout@<sha-40-caractères> # v5
# =============================================================================
name: CI/CD tasks-api

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Droits minimaux par défaut pour tous les jobs
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false   # ne jamais couper un déploiement en cours

jobs:
  # ---------------------------------------------------------------------------
  # 1. CI : lint + tests + couverture (sur chaque push ET chaque pull request)
  # ---------------------------------------------------------------------------
  build:
    name: Lint, tests et couverture
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: JDK 21 (Temurin) + cache Maven
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # verify = checkstyle (validate) + tests + rapport JaCoCo + quality gate couverture
      - name: Build et tests
        run: ./mvnw -B verify

      - name: Résumé des tests
        if: always()
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          tests = failures = errors = skipped = 0
          rows = []
          for f in sorted(glob.glob("target/surefire-reports/TEST-*.xml")):
              r = ET.parse(f).getroot()
              t, fa, e, s = (int(r.get(k, 0)) for k in ("tests", "failures", "errors", "skipped"))
              tests += t; failures += fa; errors += e; skipped += s
              status = "OK" if fa + e == 0 else "ECHEC"
              rows.append(f"| {r.get('name')} | {t} | {fa + e} | {status} |")
          print("## Résultats des tests")
          print(f"**{tests}** tests, **{failures + errors}** en échec, **{skipped}** ignorés\n")
          print("| Classe | Tests | Échecs | Statut |")
          print("|---|---|---|---|")
          print("\n".join(rows) if rows else "| (aucun rapport) | 0 | 0 | - |")
          EOF

      - name: Rapport de couverture JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 2. Image Docker, construite UNE SEULE FOIS, taguée avec le SHA du commit
  # ---------------------------------------------------------------------------
  image:
    name: Image Docker -> GHCR
    needs: build
    # Seulement sur main (push ou lancement manuel), jamais sur une pull request
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write   # seul ce job a le droit d'écrire dans le registre
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Nom de l'image (en minuscules, exigé par GHCR)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tasks-api:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.name.outputs.image }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            APP_VERSION=${{ github.sha }}
            APP_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Résumé
        run: |
          {
            echo "## Image construite une seule fois"
            echo "\`${{ steps.name.outputs.image }}\`"
            echo ""
            echo "C'est **cette même image** qui sera déployée en dev, puis en prod."
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 3. Déploiement en DEV : automatique après chaque merge sur main
  # ---------------------------------------------------------------------------
  deploy-dev:
    name: Déployer en dev
    needs: image
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
      image: ${{ needs.image.outputs.image }}
    secrets: inherit
    permissions:
      contents: read
      packages: read

  # ---------------------------------------------------------------------------
  # 4. Déploiement en PROD : seulement si dev est vert,
  #    et après approbation humaine (règle posée sur l'environnement « prod »)
  # ---------------------------------------------------------------------------
  deploy-prod:
    name: Déployer en prod
    needs: [image, deploy-dev]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: prod
      image: ${{ needs.image.outputs.image }}
    secrets: inherit
    permissions:
      contents: read
      packages: read
